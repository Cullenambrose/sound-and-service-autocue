name: BOOTH BUDDY native macOS verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'web/**'
      - 'engine/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/macos-native.yml'
permissions:
  contents: read
concurrency:
  group: native-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # macos-15 is the standard arm64 runner; signing/release publication is separate.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'arm64'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated native build environment
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/desktop/build-constraints.txt
        run: bash scripts/prepare_macos_xcode.sh
      - name: Run synthetic native verification
        env:
          BOOTH_BUDDY_RESULTS_PARENT: ${{ runner.temp }}
        run: bash desktop/verify_native.sh
      - name: Keep synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-synthetic-screenshots
          path: ${{ runner.temp }}/booth-buddy-verify.*/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
      # Do not upload raw environments, private databases, runtime tokens or unredacted logs.
