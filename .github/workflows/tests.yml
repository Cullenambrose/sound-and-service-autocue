name: Synthetic regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - run: python -m unittest discover -s engine -p 'test_*.py'
      - run: pytest engine/setlist/test_setlist.py engine/library/test_library.py engine/library/test_matcher.py engine/library/test_serato_crate_integration.py engine/library/test_serato_integration.py engine/test_serato_crate_writer.py engine/test_serato_database.py -q
      - run: python -m unittest web.test_catalog web.test_vendor_import web.test_scan_jobs web.test_server
      - run: PYTHONPATH=engine pytest -q web/test_studio.py web/test_studio_product.py web/test_library_operations.py engine/setlist/test_planning.py engine/setlist/test_transitions.py
      - run: node --test web/test_*.cjs
      - name: Verify installed wheel outside checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir "${{ runner.temp }}/autocue-wheels"
          python -m pip install --no-deps --force-reinstall "${{ runner.temp }}"/autocue-wheels/*.whl
          python scripts/verify_worker_install.py
          python scripts/verify_studio_install.py
